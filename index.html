<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>역사 기말고사 학습 사이트</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1 id="app-title">역사 기말고사 학습 사이트</h1>
      <p id="app-subtitle" class="subtitle"></p>
    </div>
  </header>

  <nav class="main-nav">
    <div class="container nav-inner">
      <button data-route="home" class="nav-btn active">단원별 정리</button>
      <button data-route="drill-all" class="nav-btn">전체 카드 학습</button>
      <button data-route="stats" class="nav-btn">진행 통계</button>
    </div>
  </nav>

  <main class="container">
    <section id="view-home" class="view active">
      <div id="unit-list" class="unit-grid"></div>
    </section>

    <section id="view-unit" class="view">
      <div class="unit-header">
        <button data-action="back-home" class="btn ghost">← 단원 목록</button>
        <h2 id="unit-title"></h2>
        <p id="unit-subtitle" class="subtitle"></p>
      </div>
      <div class="tabs">
        <button data-tab="summary" class="tab-btn active">정리</button>
        <button data-tab="cards" class="tab-btn">플래시카드</button>
        <button data-tab="quiz" class="tab-btn">퀴즈</button>
      </div>
      <section id="tab-summary" class="tab-pane active">
        <div id="sections"></div>
      </section>
      <section id="tab-cards" class="tab-pane">
        <div class="card-toolbar">
          <button data-action="start-unit-cards" class="btn">단원 카드 학습</button>
          <button data-action="start-due-cards" class="btn ghost">기한 도래 카드</button>
        </div>
        <div id="card-stage" class="card-stage hidden"></div>
        <div id="card-list" class="card-list"></div>
      </section>
      <section id="tab-quiz" class="tab-pane">
        <div class="quiz-toolbar">
          <button data-action="start-quiz" class="btn">퀴즈 시작</button>
        </div>
        <div id="quiz-stage" class="quiz-stage hidden"></div>
      </section>
    </section>

    <section id="view-drill-all" class="view">
      <h2>전체 카드 학습</h2>
      <div id="drill-all-stage" class="card-stage"></div>
    </section>

    <section id="view-stats" class="view">
      <h2>진행 통계</h2>
      <div id="stats-content"></div>
      <button data-action="reset-all" class="btn ghost">기록 초기화</button>
    </section>
  </main>

  <script src="assets/data/core.js"></script>
  <script src="assets/data/u1.js"></script>
  <script src="assets/data/u1c.js"></script>
  <script src="assets/data/u1z.js"></script>
  <script src="assets/data/u2.js"></script>
  <script src="assets/data/u2c.js"></script>
  <script src="assets/data/u2z.js"></script>
  <script src="assets/data/u3.js"></script>
  <script src="assets/data/u3c.js"></script>
  <script src="assets/data/u3z.js"></script>
  <script src="assets/data/u4.js"></script>
  <script src="assets/data/u4c.js"></script>
  <script src="assets/data/u4z.js"></script>
  <script src="assets/data/u5.js"></script>
  <script src="assets/data/u5c.js"></script>
  <script src="assets/data/u5z.js"></script>
  <script src="assets/data/u6.js"></script>
  <script src="assets/data/u6c.js"></script>
  <script src="assets/data/u6z.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
